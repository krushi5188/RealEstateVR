name: Build ArchNative Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Enables manual button click

jobs:
  build-macos:
    runs-on: macos-13 # Force Intel (x64) for compatibility
    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0'
        host: 'mac'
        target: 'desktop'
        modules: 'qtmultimedia qt3d'

    - name: Install Dependencies
      run: brew install opencv tesseract cmake pkg-config vulkan-headers

    - name: Install OpenXR (Vcpkg)
      run: |
        vcpkg install openxr-loader --triplet=x64-osx

    - name: Configure CMake
      run: |
        export PKG_CONFIG_PATH=$VCPKG_INSTALLATION_ROOT/installed/x64-osx/lib/pkgconfig:$PKG_CONFIG_PATH
        cmake -S ArchNative -B build -G "Unix Makefiles" -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR

    - name: Build
      run: cmake --build build --config Release

    - name: Package DMG
      run: macdeployqt build/ArchNative.app -dmg

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ArchNative-macOS
        path: build/ArchNative.dmg

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Install Dependencies (Vcpkg)
      run: |
        vcpkg install opencv:x64-windows
        vcpkg install tesseract:x64-windows
        vcpkg install openxr-loader:x64-windows
        vcpkg integrate install

    - name: Check Source Directory (Debug)
      run: |
        ls -R ArchNative

    - name: Configure CMake
      run: cmake -S ArchNative -B build -DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

    - name: Build
      run: cmake --build build --config Release

    - name: Package
      run: windeployqt build/Release/ArchNative.exe --dir dist

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ArchNative-Windows
        path: dist/

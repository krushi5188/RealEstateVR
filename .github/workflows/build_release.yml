name: Build ArchNative Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-13 # Intel Mac (x64) - Best compatibility for OpenXR
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      VCPKG_ROOT: /usr/local/share/vcpkg
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies (Homebrew)
      run: |
        brew install opencv tesseract cmake pkg-config vulkan-headers qt@6
        echo "QT_ROOT_DIR=$(brew --prefix qt@6)" >> $GITHUB_ENV
        echo "$(brew --prefix qt@6)/bin" >> $GITHUB_PATH

    - name: Install OpenXR (Vcpkg)
      run: |
        $VCPKG_INSTALLATION_ROOT/vcpkg install openxr-loader --triplet=x64-osx

    # --- CRITICAL FIX FOR MACOS VR ---
    - name: Patch C++ Code for macOS Platform
      run: |
        echo "Converting Linux (X11) code to macOS (Cocoa)..."
        
        # 1. Replace the Linux macro with the Mac macro in the source file
        # This stops openxr_platform.h from looking for 'Display*' and 'GLXContext'
        sed -i '' 's/XR_USE_PLATFORM_XLIB/XR_USE_PLATFORM_MACOS/g' ArchNative/src/Core/OpenXRManager.cpp || true
        
        # 2. Replace the Linux header with the Mac OpenGL header
        sed -i '' 's|#include <GL/glx.h>|#include <OpenGL/gl.h>|g' ArchNative/src/Core/OpenXRManager.cpp || true
        
        # 3. Fix the CMake target name (Common issue with Vcpkg on Mac)
        sed -i '' 's/OpenXR::OpenXR/OpenXR::openxr_loader/g' ArchNative/CMakeLists.txt || true
        
        echo "Patches applied. Source is now configured for macOS."

    - name: Configure CMake
      run: |
        # We explicitly define XR_USE_PLATFORM_MACOS here to ensure the build system knows the target
        cmake -S ArchNative -B build \
          -G "Unix Makefiles" \
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_TARGET_TRIPLET=x64-osx \
          -DCMAKE_CXX_FLAGS="-DGL_SILENCE_DEPRECATION -DXR_USE_PLATFORM_MACOS -DXR_USE_GRAPHICS_API_OPENGL"

    - name: Build
      run: cmake --build build --config Release

    - name: Package DMG
      run: macdeployqt build/ArchNative.app -dmg -verbose=1

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ArchNative-macOS
        path: build/*.dmg

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Install Dependencies (Vcpkg)
      run: |
        vcpkg install opencv:x64-windows
        vcpkg install tesseract:x64-windows
        vcpkg install openxr-loader:x64-windows
        vcpkg install jsoncpp:x64-windows
        vcpkg integrate install

    - name: Configure CMake
      run: cmake -S ArchNative -B build -A x64 -DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

    - name: Build
      run: cmake --build build --config Release

    - name: Package & Copy DLLs
      shell: pwsh
      run: |
        windeployqt build/Release/ArchNative.exe --dir dist
        
        Write-Host "Copying Vcpkg DLLs..."
        $vcpkgBin = "C:\vcpkg\installed\x64-windows\bin"
        
        Copy-Item "$vcpkgBin\openxr_loader.dll" -Destination "dist/" -ErrorAction SilentlyContinue
        Copy-Item "$vcpkgBin\jsoncpp.dll" -Destination "dist/" -ErrorAction SilentlyContinue
        Get-ChildItem "$vcpkgBin" -Filter "opencv_world*.dll" | Copy-Item -Destination "dist/"
        Get-ChildItem "$vcpkgBin" -Filter "tesseract*.dll" | Copy-Item -Destination "dist/"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ArchNative-Windows
        path: dist/

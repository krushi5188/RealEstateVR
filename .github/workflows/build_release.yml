name: Build ArchNative Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-13 # Intel Mac (x64)
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      VCPKG_ROOT: /usr/local/share/vcpkg
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies (Homebrew)
      run: |
        brew install opencv tesseract cmake pkg-config vulkan-headers qt@6
        
        # Resolve REAL paths
        QT_REAL_PATH=$(realpath $(brew --prefix qt@6))
        echo "QT_ROOT_DIR=$QT_REAL_PATH" >> $GITHUB_ENV
        echo "QT_LIB_DIR=$QT_REAL_PATH/lib" >> $GITHUB_ENV
        echo "QT_PLUGIN_DIR=$QT_REAL_PATH/share/qt/plugins" >> $GITHUB_ENV
        echo "$QT_REAL_PATH/bin" >> $GITHUB_PATH

    - name: Install OpenXR (Vcpkg)
      run: |
        $VCPKG_INSTALLATION_ROOT/vcpkg install openxr-loader --triplet=x64-osx

    - name: Patch C++ Code for macOS
      run: |
        # Patching to force Mac Cocoa/OpenGL backend instead of Linux X11
        sed -i '' 's/XR_USE_PLATFORM_XLIB/XR_USE_PLATFORM_MACOS/g' ArchNative/src/Core/OpenXRManager.cpp || true
        sed -i '' 's|#include <GL/glx.h>|#include <OpenGL/gl.h>|g' ArchNative/src/Core/OpenXRManager.cpp || true
        sed -i '' '1i\
        #if defined(__APPLE__)\
        typedef void* Display;\
        typedef void* GLXFBConfig;\
        typedef void* GLXDrawable;\
        typedef void* GLXContext;\
        #endif\
        ' ArchNative/src/Core/OpenXRManager.cpp
        sed -i '' 's/OpenXR::OpenXR/OpenXR::openxr_loader/g' ArchNative/CMakeLists.txt || true

    - name: Configure CMake
      run: |
        cmake -S ArchNative -B build \
          -G "Unix Makefiles" \
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_TARGET_TRIPLET=x64-osx \
          -DCMAKE_INSTALL_RPATH="$QT_LIB_DIR" \
          -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
          -DCMAKE_CXX_FLAGS="-DGL_SILENCE_DEPRECATION -DXR_USE_PLATFORM_MACOS -DXR_USE_GRAPHICS_API_OPENGL"

    - name: Build
      run: cmake --build build --config Release

    # --- THE FIX: MANUAL FRAMEWORK COPYING ---
    - name: Package DMG (Pre-Copy Fix)
      run: |
        echo "Packaging..."
        APP_BUNDLE="build/ArchNative.app"
        FRAMEWORKS_DIR="$APP_BUNDLE/Contents/Frameworks"
        
        # 1. Create Frameworks directory
        mkdir -p "$FRAMEWORKS_DIR"
        
        # 2. Manually copy the Qt Frameworks into the bundle
        # This forces macdeployqt to find them locally instead of searching the system
        echo "Pre-copying Qt Frameworks from $QT_LIB_DIR..."
        cp -R "$QT_LIB_DIR/"Qt*.framework "$FRAMEWORKS_DIR/"
        
        # 3. Clean up any 'Headers' symlinks to save space/confusion (Optional but good practice)
        find "$FRAMEWORKS_DIR" -name "Headers" -delete
        
        # 4. Run macdeployqt
        # -always-overwrite tells it to use the files we just copied
        # We DO NOT pass -libpath here to avoid confusing it further
        macdeployqt "$APP_BUNDLE" -dmg -verbose=1 -always-overwrite

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ArchNative-macOS
        path: build/*.dmg

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Setup Vcpkg
      run: vcpkg integrate install

    - name: Install Dependencies (Vcpkg)
      shell: pwsh
      run: |
        vcpkg install opencv:x64-windows
        vcpkg install tesseract:x64-windows
        vcpkg install openxr-loader:x64-windows
        vcpkg install jsoncpp:x64-windows
        vcpkg integrate install

    - name: Configure CMake
      run: cmake -S ArchNative -B build -DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

    - name: Build
      run: cmake --build build --config Release

    - name: Package
      run: |
        windeployqt build/Release/ArchNative.exe --dir dist
        Copy-Item -Path "C:/vcpkg/installed/x64-windows/bin/*.dll" -Destination "dist/" -Force
        ls dist

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ArchNative-Windows
        path: dist/

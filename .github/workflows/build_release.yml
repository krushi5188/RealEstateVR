name: Build ArchNative Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15 # ARM64 runner
    timeout-minutes: 360
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      VCPKG_ROOT: /usr/local/share/vcpkg
    steps:
    - uses: actions/checkout@v4

    # Install Qt x86_64 via official action (Works on ARM runners via Rosetta)
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0' # Sticking to stable LTS
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64' # Intel 64-bit architecture

    - name: Install Tools (Homebrew)
      run: |
        # Only install tools, NOT libraries that link to ARM64 Qt/OpenCV
        brew install cmake pkg-config vulkan-headers dylibbundler
        # Export paths for dylibbundler
        # Note: Vcpkg paths will be set later

    # Cache Vcpkg to speed up build
    - name: Cache Vcpkg
      id: cache-vcpkg-mac
      uses: actions/cache@v4
      with:
        path: /usr/local/share/vcpkg/installed
        key: ${{ runner.os }}-vcpkg-opencv-tesseract-openxr-x64-v1

    - name: Install Dependencies (Vcpkg)
      if: steps.cache-vcpkg-mac.outputs.cache-hit != 'true'
      # Force x64-osx triplet to cross-compile for Intel
      run: |
        $VCPKG_INSTALLATION_ROOT/vcpkg install \
          openxr-loader:x64-osx \
          opencv:x64-osx \
          tesseract:x64-osx \
          jsoncpp:x64-osx

    - name: Configure CMake
      run: |
        cmake -S ArchNative -B build \
          -G "Unix Makefiles" \
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_TARGET_TRIPLET=x64-osx \
          -DCMAKE_OSX_ARCHITECTURES=x86_64 \
          -DCMAKE_INSTALL_PREFIX=dist \
          -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
          -DCMAKE_CXX_FLAGS="-DGL_SILENCE_DEPRECATION -DXR_USE_PLATFORM_MACOS -DXR_USE_GRAPHICS_API_OPENGL"

    - name: Build & Install
      run: |
        cmake --build build --config Release
        cmake --install build

    - name: Bundle & Deploy
      run: |
        echo "Starting Bundling Process..."
        APP_PATH="dist/ArchNative.app"

        # 1. Use macdeployqt from the installed Qt action
        # It handles Qt frameworks correctly for the installed version
        macdeployqt "$APP_PATH" -verbose=1 -always-overwrite || true

        # 2. Bundle External Libs (Vcpkg) using dylibbundler
        dylibbundler -of -b -x "$APP_PATH/Contents/MacOS/ArchNative" \
          -d "$APP_PATH/Contents/Frameworks" \
          -p "@executable_path/../Frameworks/" \
          -s /usr/local/lib \
          -s $VCPKG_ROOT/installed/x64-osx/lib

        # 3. Create qt.conf (Ensuring PlugIns are found)
        if [ ! -f "$APP_PATH/Contents/Resources/qt.conf" ]; then
            mkdir -p "$APP_PATH/Contents/Resources"
            echo "[Paths]" > "$APP_PATH/Contents/Resources/qt.conf"
            echo "Plugins = PlugIns" >> "$APP_PATH/Contents/Resources/qt.conf"
        fi

        # 4. Create Entitlements
        cat <<EOF > entitlements.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>com.apple.security.cs.disable-library-validation</key>
            <true/>
            <key>com.apple.security.get-task-allow</key>
            <true/>
        </dict>
        </plist>
        EOF

        # 5. Sign Everything
        codesign --force --deep --sign - --entitlements entitlements.plist "$APP_PATH"

        # 6. Create DMG
        hdiutil create -volname "ArchNative" -srcfolder "$APP_PATH" -ov -format UDZO "ArchNative.dmg"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ArchNative-macOS
        path: ArchNative.dmg

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
    - name: Setup Vcpkg
      run: vcpkg integrate install
    - name: Install Dependencies
      shell: pwsh
      run: |
        vcpkg install opencv:x64-windows
        vcpkg install tesseract:x64-windows
        vcpkg install openxr-loader:x64-windows
        vcpkg install jsoncpp:x64-windows
        vcpkg integrate install
    - name: Configure CMake
      run: cmake -S ArchNative -B build -DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
    - name: Build
      run: cmake --build build --config Release
    - name: Package
      run: |
        windeployqt build/Release/ArchNative.exe --dir dist
        Copy-Item -Path "C:/vcpkg/installed/x64-windows/bin/*.dll" -Destination "dist/" -Force
    - uses: actions/upload-artifact@v4
      with:
        name: ArchNative-Windows
        path: dist/

name: Build ArchNative Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-13 # Intel Mac (x64)
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      VCPKG_ROOT: /usr/local/share/vcpkg
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies (Homebrew)
      run: |
        brew install opencv tesseract cmake pkg-config vulkan-headers qt@6 dylibbundler
        QT_REAL_PATH=$(realpath $(brew --prefix qt@6))
        echo "QT_ROOT_DIR=$QT_REAL_PATH" >> $GITHUB_ENV
        echo "QT_LIB_DIR=$QT_REAL_PATH/lib" >> $GITHUB_ENV
        echo "QT_PLUGIN_DIR=$QT_REAL_PATH/share/qt/plugins" >> $GITHUB_ENV
        echo "$QT_REAL_PATH/bin" >> $GITHUB_PATH

    - name: Install OpenXR (Vcpkg)
      run: $VCPKG_INSTALLATION_ROOT/vcpkg install openxr-loader --triplet=x64-osx

    - name: Configure CMake
      run: |
        cmake -S ArchNative -B build \
          -G "Unix Makefiles" \
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_TARGET_TRIPLET=x64-osx \
          -DCMAKE_INSTALL_RPATH="@executable_path/../Frameworks" \
          -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
          -DCMAKE_CXX_FLAGS="-DGL_SILENCE_DEPRECATION -DXR_USE_PLATFORM_MACOS -DXR_USE_GRAPHICS_API_OPENGL"

    - name: Build
      run: cmake --build build --config Release

    - name: Manual Bundle & Dependency Fix
      run: |
        echo "Starting Bundling Process..."

        APP_NAME="ArchNative"
        APP_BUNDLE="build/$APP_NAME.app"
        CONTENTS="$APP_BUNDLE/Contents"
        FRAMEWORKS="$CONTENTS/Frameworks"
        PLUGINS="$CONTENTS/PlugIns"
        RESOURCES="$CONTENTS/Resources"
        MACOS="$CONTENTS/MacOS"
        EXECUTABLE="$MACOS/$APP_NAME"

        mkdir -p "$FRAMEWORKS" "$PLUGINS" "$RESOURCES"

        # 1. Copy Qt Frameworks
        echo "Copying Qt Frameworks..."
        cp -R "$QT_LIB_DIR/QtCore.framework" "$FRAMEWORKS/"
        cp -R "$QT_LIB_DIR/QtGui.framework" "$FRAMEWORKS/"
        cp -R "$QT_LIB_DIR/QtWidgets.framework" "$FRAMEWORKS/"
        cp -R "$QT_LIB_DIR/QtOpenGL.framework" "$FRAMEWORKS/"
        cp -R "$QT_LIB_DIR/QtOpenGLWidgets.framework" "$FRAMEWORKS/"
        cp -R "$QT_LIB_DIR/QtPrintSupport.framework" "$FRAMEWORKS/"
        cp -R "$QT_LIB_DIR/QtDBus.framework" "$FRAMEWORKS/"
        find "$FRAMEWORKS" -name "Headers" -depth -exec rm -rf {} \;

        # 2. Copy Qt Plugins
        echo "Copying Qt Plugins..."
        mkdir -p "$PLUGINS/platforms" "$PLUGINS/imageformats"
        cp "$QT_PLUGIN_DIR/platforms/libqcocoa.dylib" "$PLUGINS/platforms/"
        cp "$QT_PLUGIN_DIR/imageformats/libqjpeg.dylib" "$PLUGINS/imageformats/"

        # 3. Create qt.conf
        echo "Creating qt.conf..."
        echo "[Paths]" > "$RESOURCES/qt.conf"
        echo "Plugins = PlugIns" >> "$RESOURCES/qt.conf"

        # 4. Patch Qt Framework IDs
        echo "Patching Qt IDs..."
        for fw in QtCore QtGui QtWidgets QtOpenGL QtOpenGLWidgets QtPrintSupport QtDBus; do
            TARGET="$FRAMEWORKS/$fw.framework/Versions/A/$fw"
            install_name_tool -id "@rpath/$fw.framework/Versions/A/$fw" "$TARGET"
            install_name_tool -change "@rpath/QtCore.framework/Versions/A/QtCore" "@rpath/QtCore.framework/Versions/A/QtCore" "$TARGET" || true
            install_name_tool -change "@rpath/QtGui.framework/Versions/A/QtGui" "@rpath/QtGui.framework/Versions/A/QtGui" "$TARGET" || true
        done

        # 5. Patch Qt Plugins
        echo "Patching Qt Plugins..."
        for plugin in "$PLUGINS/platforms/libqcocoa.dylib" "$PLUGINS/imageformats/libqjpeg.dylib"; do
            install_name_tool -add_rpath "@executable_path/../../Frameworks" "$plugin" || true
            install_name_tool -change "@rpath/QtCore.framework/Versions/A/QtCore" "@rpath/QtCore.framework/Versions/A/QtCore" "$plugin"
            install_name_tool -change "@rpath/QtGui.framework/Versions/A/QtGui" "@rpath/QtGui.framework/Versions/A/QtGui" "$plugin"
            install_name_tool -change "@rpath/QtWidgets.framework/Versions/A/QtWidgets" "@rpath/QtWidgets.framework/Versions/A/QtWidgets" "$plugin"
        done

        # 6. FIX: dylibbundler (Bundle external libs like OpenCV)
        echo "Running dylibbundler..."
        dylibbundler -of -b -x "$EXECUTABLE" -d "$FRAMEWORKS" -p "@executable_path/../Frameworks/" -s /usr/local/lib

        # 7. Create/Verify Info.plist (Essential for macOS to recognize it as an app)
        if [ ! -f "$CONTENTS/Info.plist" ]; then
            echo "Generating minimal Info.plist..."
            cat <<EOF > "$CONTENTS/Info.plist"
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>$APP_NAME</string>
            <key>CFBundleIdentifier</key>
            <string>com.archnative.app</string>
            <key>CFBundleName</key>
            <string>$APP_NAME</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
        </dict>
        </plist>
        EOF
        fi

        # 8. Create Entitlements (Required for ad-hoc signing to work smoothly)
        cat <<EOF > "$CONTENTS/entitlements.plist"
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>com.apple.security.cs.disable-library-validation</key>
            <true/>
            <key>com.apple.security.get-task-allow</key>
            <true/>
        </dict>
        </plist>
        EOF

        # 9. Fix Permissions
        echo "Fixing Permissions..."
        chmod -R 755 "$APP_BUNDLE"

        # 10. Code Signing (Ad-hoc with Entitlements)
        echo "Signing..."
        codesign --force --deep --sign - --entitlements "$CONTENTS/entitlements.plist" "$APP_BUNDLE"

        # 11. Create DMG
        echo "Creating DMG..."
        hdiutil create -volname "$APP_NAME" -srcfolder "$APP_BUNDLE" -ov -format UDZO "build/$APP_NAME.dmg"
        echo "Done!"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ArchNative-macOS
        path: build/*.dmg

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
    - name: Setup Vcpkg
      run: vcpkg integrate install
    - name: Install Dependencies
      shell: pwsh
      run: |
        vcpkg install opencv:x64-windows
        vcpkg install tesseract:x64-windows
        vcpkg install openxr-loader:x64-windows
        vcpkg install jsoncpp:x64-windows
        vcpkg integrate install
    - name: Configure CMake
      run: cmake -S ArchNative -B build -DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
    - name: Build
      run: cmake --build build --config Release
    - name: Package
      run: |
        windeployqt build/Release/ArchNative.exe --dir dist
        Copy-Item -Path "C:/vcpkg/installed/x64-windows/bin/*.dll" -Destination "dist/" -Force
    - uses: actions/upload-artifact@v4
      with:
        name: ArchNative-Windows
        path: dist/

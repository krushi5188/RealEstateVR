name: Build ArchNative Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.0'
        host: 'mac'
        target: 'desktop'
        modules: 'qtmultimedia qt3d'

    - name: Install Dependencies
      run: |
        brew update
        brew install opencv tesseract
        brew install --cask xquartz
        
        # Install build tools
        brew install cmake pkg-config ninja
        
        # Install OpenXR dependencies
        brew install libffi glew sdl2

    - name: Build and Install OpenXR
      run: |
        echo "Building OpenXR from source..."
        
        # Download OpenXR SDK source
        cd /tmp
        wget https://github.com/KhronosGroup/OpenXR-SDK/archive/refs/tags/release-1.0.28.tar.gz -O openxr.tar.gz
        tar -xzf openxr.tar.gz
        cd OpenXR-SDK-release-1.0.28
        
        # Create build directory
        mkdir build
        cd build
        
        # Configure OpenXR
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/usr/local \
          -DBUILD_TESTS=OFF \
          -DBUILD_LOADER=ON \
          -DPRINT_LOADER_DEBUG=OFF
        
        # Build and install
        make -j$(sysctl -n hw.logicalcpu)
        sudo make install
        
        echo "OpenXR installation complete"

    - name: Configure CMake
      run: |
        # Check current directory and list files
        pwd
        ls -la
        
        # Configure the project
        cmake -B build \
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
          -DCMAKE_BUILD_TYPE=Release \
          -DOpenXR_ROOT=/usr/local \
          -G "Unix Makefiles"

    - name: Build
      run: |
        cmake --build build --config Release --parallel $(sysctl -n hw.logicalcpu)

    - name: Deploy Qt Dependencies
      run: |
        # Check if app exists
        if [ -d "build/ArchNative.app" ]; then
          macdeployqt build/ArchNative.app -verbose=2
        else
          echo "Error: ArchNative.app not found in build directory"
          ls -la build/
          exit 1
        fi

    - name: Bundle OpenXR Library
      run: |
        # Find and bundle OpenXR library
        OPENXR_LIB=$(find /usr/local/lib -name "libopenxr_loader*.dylib" 2>/dev/null | head -1)
        if [ -n "$OPENXR_LIB" ]; then
          echo "Found OpenXR library: $OPENXR_LIB"
          mkdir -p build/ArchNative.app/Contents/Frameworks
          cp "$OPENXR_LIB" build/ArchNative.app/Contents/Frameworks/
          
          LIB_NAME=$(basename "$OPENXR_LIB")
          install_name_tool -change "$OPENXR_LIB" "@executable_path/../Frameworks/$LIB_NAME" \
            build/ArchNative.app/Contents/MacOS/ArchNative 2>/dev/null || true
        fi

    - name: Create DMG
      run: |
        macdeployqt build/ArchNative.app -dmg

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ArchNative-macOS
        path: build/ArchNative.dmg

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Debug - List directory contents
      shell: bash
      run: |
        echo "Current directory:"
        pwd
        echo "Contents:"
        ls -la
        echo "Checking for CMakeLists.txt:"
        find . -name "CMakeLists.txt" -type f | head -5

    - name: Setup Vcpkg
      shell: pwsh
      run: |
        Write-Host "Setting up vcpkg..."
        if (-not (Test-Path "C:\vcpkg")) {
          git clone https://github.com/Microsoft/vcpkg.git C:\vcpkg
          & C:\vcpkg\bootstrap-vcpkg.bat
        } else {
          Write-Host "vcpkg already exists"
        }

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        modules: 'qtmultimedia qt3d'

    - name: Install Dependencies (Vcpkg)
      shell: pwsh
      run: |
        Write-Host "Installing dependencies with vcpkg..."
        & C:\vcpkg\vcpkg install opencv:x64-windows
        & C:\vcpkg\vcpkg install tesseract:x64-windows
        & C:\vcpkg\vcpkg install openxr-loader:x64-windows
        & C:\vcpkg\vcpkg integrate install

    - name: Configure CMake
      shell: pwsh
      run: |
        Write-Host "Current directory: $(Get-Location)"
        Write-Host "Listing files:"
        Get-ChildItem -Force
        
        # Check if CMakeLists.txt exists
        if (-not (Test-Path "CMakeLists.txt")) {
          Write-Error "CMakeLists.txt not found in current directory!"
          exit 1
        }
        
        Write-Host "Configuring CMake..."
        $QT_PATH = $env:QT_ROOT_DIR -replace '\\', '/'
        
        cmake -B build `
          -DCMAKE_PREFIX_PATH="$QT_PATH" `
          -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DCMAKE_BUILD_TYPE=Release `
          -A x64

    - name: Build
      shell: pwsh
      run: |
        cmake --build build --config Release --parallel

    - name: Package
      shell: pwsh
      run: |
        # Create dist directory
        if (-not (Test-Path "dist")) {
          New-Item -ItemType Directory -Path "dist"
        }
        
        # Find and copy the executable
        $exePath = Get-ChildItem -Path "build" -Filter "ArchNative.exe" -Recurse | Select-Object -First 1
        if ($exePath) {
          Write-Host "Found executable at: $($exePath.FullName)"
          Copy-Item $exePath.FullName -Destination "dist/"
          
          # Run windeployqt
          windeployqt dist/ArchNative.exe --dir dist
        } else {
          Write-Error "ArchNative.exe not found in build directory!"
          Get-ChildItem -Path "build" -Recurse -Filter "*.exe" | ForEach-Object { Write-Host "Found: $($_.FullName)" }
          exit 1
        }
        
        # Copy OpenXR loader
        $openxrDll = Get-ChildItem -Path "C:\vcpkg\installed\x64-windows\bin" -Filter "openxr_loader*.dll" | Select-Object -First 1
        if ($openxrDll) {
          Copy-Item $openxrDll.FullName -Destination "dist/"
        }

    - name: Zip Windows artifacts
      shell: pwsh
      run: |
        if (Test-Path "dist") {
          Compress-Archive -Path dist/* -DestinationPath ArchNative-Windows.zip -Force
        } else {
          Write-Error "dist directory not found!"
          exit 1
        }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ArchNative-Windows
        path: ArchNative-Windows.zip

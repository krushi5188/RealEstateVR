name: Build ArchNative Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-13 # Intel Mac (x64)
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      VCPKG_ROOT: /usr/local/share/vcpkg
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies (Homebrew)
      run: |
        # Install Qt6 and dependencies
        brew install opencv tesseract cmake pkg-config vulkan-headers qt@6
        
        # Set Environment variables for Homebrew Qt
        echo "QT_ROOT_DIR=$(brew --prefix qt@6)" >> $GITHUB_ENV
        echo "Qt6_DIR=$(brew --prefix qt@6)/lib/cmake/Qt6" >> $GITHUB_ENV
        
        # Add Qt bin to PATH
        echo "$(brew --prefix qt@6)/bin" >> $GITHUB_PATH

    - name: Install OpenXR (Vcpkg)
      run: |
        $VCPKG_INSTALLATION_ROOT/vcpkg install openxr-loader --triplet=x64-osx

    # --- COMPILATION FIXES ---
    - name: Patch C++ Code for macOS
      run: |
        echo "Patching source for macOS..."
        # 1. Force Mac Platform Macro
        sed -i '' 's/XR_USE_PLATFORM_XLIB/XR_USE_PLATFORM_MACOS/g' ArchNative/src/Core/OpenXRManager.cpp || true
        # 2. Swap Linux Header for Mac Header
        sed -i '' 's|#include <GL/glx.h>|#include <OpenGL/gl.h>|g' ArchNative/src/Core/OpenXRManager.cpp || true
        # 3. Inject fake X11 typedefs (Safety Net)
        sed -i '' '1i\
        #if defined(__APPLE__)\
        typedef void* Display;\
        typedef void* GLXFBConfig;\
        typedef void* GLXDrawable;\
        typedef void* GLXContext;\
        #endif\
        ' ArchNative/src/Core/OpenXRManager.cpp
        # 4. Patch CMake target name
        sed -i '' 's/OpenXR::OpenXR/OpenXR::openxr_loader/g' ArchNative/CMakeLists.txt || true

    - name: Configure CMake
      run: |
        cmake -S ArchNative -B build \
          -G "Unix Makefiles" \
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_TARGET_TRIPLET=x64-osx \
          -DCMAKE_CXX_FLAGS="-DGL_SILENCE_DEPRECATION -DXR_USE_PLATFORM_MACOS -DXR_USE_GRAPHICS_API_OPENGL"

    - name: Build
      run: cmake --build build --config Release

    # --- DEPLOYMENT FIX (The Final Piece) ---
    - name: Package DMG (Homebrew Fix)
      run: |
        echo "Packaging..."
        
        # Calculate paths dynamically
        QT_PREFIX=$(brew --prefix qt@6)
        QT_LIB="$QT_PREFIX/lib"
        QT_PLUGINS="$QT_PREFIX/share/qt/plugins"
        
        # CRITICAL: Force macdeployqt to look here using environment variables
        export DYLD_FRAMEWORK_PATH="$QT_LIB"
        export DYLD_LIBRARY_PATH="$QT_LIB"
        
        # We assume the binary already has the RPATH (cmake did it), so we skip install_name_tool
        # We run macdeployqt with -libpath to be extra sure
        macdeployqt build/ArchNative.app -dmg -verbose=1 -libpath="$QT_LIB"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ArchNative-macOS
        path: build/*.dmg

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Cache Vcpkg
      id: cache-vcpkg
      uses: actions/cache@v4
      with:
        path: |
          C:\vcpkg\installed
          C:\vcpkg\packages
          C:\vcpkg\downloads
        key: ${{ runner.os }}-vcpkg-opencv-tesseract-openxr-v1

    - name: Install Dependencies (Vcpkg)
      if: steps.cache-vcpkg.outputs.cache-hit != 'true'
      run: |
        vcpkg install opencv:x64-windows
        vcpkg install tesseract:x64-windows
        vcpkg install openxr-loader:x64-windows
        vcpkg install jsoncpp:x64-windows
        vcpkg integrate install

    - name: Configure CMake
      run: cmake -S ArchNative -B build -DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

    - name: Build
      run: cmake --build build --config Release

    - name: Package
      run: |
        windeployqt build/Release/ArchNative.exe --dir dist
        Copy-Item -Path "C:/vcpkg/installed/x64-windows/bin/*.dll" -Destination "dist/" -Force
        ls dist

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ArchNative-Windows
        path: dist/

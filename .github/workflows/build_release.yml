name: Build ArchNative Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-13 # Intel Mac (x64)
    timeout-minutes: 360 # Increased from 60 to prevent timeouts
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      VCPKG_ROOT: /usr/local/share/vcpkg
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies (Homebrew)
      run: |
        brew install opencv tesseract cmake pkg-config vulkan-headers qt@6 dylibbundler
        QT_REAL_PATH=$(realpath $(brew --prefix qt@6))
        echo "QT_ROOT_DIR=$QT_REAL_PATH" >> $GITHUB_ENV
        echo "QT_LIB_DIR=$QT_REAL_PATH/lib" >> $GITHUB_ENV
        echo "QT_PLUGIN_DIR=$QT_REAL_PATH/share/qt/plugins" >> $GITHUB_ENV
        echo "$QT_REAL_PATH/bin" >> $GITHUB_PATH

        # Export paths for dylibbundler
        echo "OPENCV_LIB_DIR=$(brew --prefix opencv)/lib" >> $GITHUB_ENV
        echo "TESSERACT_LIB_DIR=$(brew --prefix tesseract)/lib" >> $GITHUB_ENV

    # Cache Vcpkg to speed up OpenXR build
    - name: Cache Vcpkg
      id: cache-vcpkg-mac
      uses: actions/cache@v4
      with:
        path: /usr/local/share/vcpkg/installed
        key: ${{ runner.os }}-vcpkg-openxr-v1

    - name: Install OpenXR (Vcpkg)
      if: steps.cache-vcpkg-mac.outputs.cache-hit != 'true'
      run: $VCPKG_INSTALLATION_ROOT/vcpkg install openxr-loader --triplet=x64-osx

    - name: Configure CMake
      run: |
        cmake -S ArchNative -B build \
          -G "Unix Makefiles" \
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_TARGET_TRIPLET=x64-osx \
          -DCMAKE_INSTALL_PREFIX=dist \
          -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
          -DCMAKE_CXX_FLAGS="-DGL_SILENCE_DEPRECATION -DXR_USE_PLATFORM_MACOS -DXR_USE_GRAPHICS_API_OPENGL"

    - name: Build & Install
      run: |
        cmake --build build --config Release
        cmake --install build

    - name: Bundle & Deploy
      run: |
        echo "Starting Bundling Process..."

        APP_PATH="dist/ArchNative.app"

        # 1. Use macdeployqt for Qt libs.
        # -always-overwrite: Force overwriting to ensure clean state
        macdeployqt "$APP_PATH" -verbose=1 -libpath=$QT_LIB_DIR -always-overwrite || true

        # 2. Bundle External Libs (OpenCV, Tesseract, OpenXR) using dylibbundler
        # Explicitly adding search paths for OpenCV and Tesseract to fix resolution warnings
        dylibbundler -of -b -x "$APP_PATH/Contents/MacOS/ArchNative" \
          -d "$APP_PATH/Contents/Frameworks" \
          -p "@executable_path/../Frameworks/" \
          -s /usr/local/lib \
          -s $VCPKG_ROOT/installed/x64-osx/lib \
          -s $OPENCV_LIB_DIR \
          -s $TESSERACT_LIB_DIR

        # 3. Create qt.conf
        if [ ! -f "$APP_PATH/Contents/Resources/qt.conf" ]; then
            mkdir -p "$APP_PATH/Contents/Resources"
            echo "[Paths]" > "$APP_PATH/Contents/Resources/qt.conf"
            echo "Plugins = PlugIns" >> "$APP_PATH/Contents/Resources/qt.conf"
        fi

        # 4. Create Entitlements (Required for ad-hoc signing)
        cat <<EOF > entitlements.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>com.apple.security.cs.disable-library-validation</key>
            <true/>
            <key>com.apple.security.get-task-allow</key>
            <true/>
        </dict>
        </plist>
        EOF

        # 5. Sign Everything (Deep)
        codesign --force --deep --sign - --entitlements entitlements.plist "$APP_PATH"

        # 6. Create DMG
        hdiutil create -volname "ArchNative" -srcfolder "$APP_PATH" -ov -format UDZO "ArchNative.dmg"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ArchNative-macOS
        path: ArchNative.dmg

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
    - name: Cache Vcpkg
      id: cache-vcpkg-win
      uses: actions/cache@v4
      with:
        path: |
          C:\vcpkg\installed
          C:\vcpkg\packages
          C:\vcpkg\downloads
        key: ${{ runner.os }}-vcpkg-opencv-tesseract-openxr-v2
    - name: Setup Vcpkg
      run: vcpkg integrate install
    - name: Install Dependencies
      if: steps.cache-vcpkg-win.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        vcpkg install opencv:x64-windows
        vcpkg install tesseract:x64-windows
        vcpkg install openxr-loader:x64-windows
        vcpkg install jsoncpp:x64-windows
        vcpkg integrate install
    - name: Configure CMake
      run: cmake -S ArchNative -B build -DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
    - name: Build
      run: cmake --build build --config Release
    - name: Package
      run: |
        windeployqt build/Release/ArchNative.exe --dir dist
        Copy-Item -Path "C:/vcpkg/installed/x64-windows/bin/*.dll" -Destination "dist/" -Force
    - uses: actions/upload-artifact@v4
      with:
        name: ArchNative-Windows
        path: dist/

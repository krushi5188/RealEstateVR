name: Build ArchNative Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-13 # Intel Mac (x64)
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      # Explicitly set Vcpkg Root
      VCPKG_ROOT: /usr/local/share/vcpkg
    steps:
    - uses: actions/checkout@v4

    # STRATEGY A: Use Official Qt (Fixes 'Cannot resolve rpath')
    - name: Install Qt (Official)
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0'
        host: 'mac'
        target: 'desktop'
        # We explicitly rely on this action to set up QT_ROOT_DIR

    - name: Install Dependencies (Homebrew)
      run: |
        # We DO NOT install qt@6 here. We use the official one above.
        brew install opencv tesseract cmake pkg-config vulkan-headers

    - name: Install OpenXR (Vcpkg)
      run: |
        $VCPKG_INSTALLATION_ROOT/vcpkg install openxr-loader --triplet=x64-osx

    # --- CRITICAL FIX FOR WORKING VR ---
    # This converts the Linux X11 code to Native macOS Cocoa/OpenGL code
    - name: Patch C++ Code for macOS Platform
      run: |
        echo "Converting Linux (X11) code to macOS (Cocoa)..."
        
        # 1. Switch OpenXR Platform macro from Linux (XLIB) to Mac
        sed -i '' 's/XR_USE_PLATFORM_XLIB/XR_USE_PLATFORM_MACOS/g' ArchNative/src/Core/OpenXRManager.cpp || true
        
        # 2. Switch Headers: GLX (Linux) -> OpenGL (Mac)
        sed -i '' 's|#include <GL/glx.h>|#include <OpenGL/gl.h>|g' ArchNative/src/Core/OpenXRManager.cpp || true
        
        # 3. Patch CMake target (Vcpkg naming fix)
        sed -i '' 's/OpenXR::OpenXR/OpenXR::openxr_loader/g' ArchNative/CMakeLists.txt || true
        
        echo "Source patched for macOS."

    - name: Configure CMake
      run: |
        # -DXR_USE_PLATFORM_MACOS is required for the compiler to pick up the patch
        cmake -S ArchNative -B build \
          -G "Unix Makefiles" \
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_TARGET_TRIPLET=x64-osx \
          -DCMAKE_CXX_FLAGS="-DGL_SILENCE_DEPRECATION -DXR_USE_PLATFORM_MACOS -DXR_USE_GRAPHICS_API_OPENGL"

    - name: Build
      run: cmake --build build --config Release

    - name: Package DMG
      run: |
        # macdeployqt works perfectly here because we used the official installer
        macdeployqt build/ArchNative.app -dmg -verbose=1

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ArchNative-macOS
        path: build/*.dmg

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Cache Vcpkg
      id: cache-vcpkg
      uses: actions/cache@v4
      with:
        path: |
          C:\vcpkg\installed
          C:\vcpkg\packages
          C:\vcpkg\downloads
        key: ${{ runner.os }}-vcpkg-opencv-tesseract-openxr-v1

    - name: Install Dependencies (Vcpkg)
      if: steps.cache-vcpkg.outputs.cache-hit != 'true'
      run: |
        vcpkg install opencv:x64-windows
        vcpkg install tesseract:x64-windows
        vcpkg install openxr-loader:x64-windows
        vcpkg install jsoncpp:x64-windows
        vcpkg integrate install

    - name: Configure CMake
      run: cmake -S ArchNative -B build -DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

    - name: Build
      run: cmake --build build --config Release

    - name: Package
      run: |
        # 1. Deploy Qt dependencies
        windeployqt build/Release/ArchNative.exe --dir dist

        # 2. Bulk Copy ALL Vcpkg DLLs
        # This ensures OpenCV, Tesseract, OpenXR, and JSONCPP are present
        Copy-Item -Path "C:/vcpkg/installed/x64-windows/bin/*.dll" -Destination "dist/" -Force

        echo "Dist folder contents:"
        ls dist

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ArchNative-Windows
        path: dist/

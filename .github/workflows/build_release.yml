name: Build ArchNative Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Enables manual button click

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Debug - List directory structure
      run: |
        echo "Current directory structure:"
        pwd
        ls -la
        echo "Looking for CMakeLists.txt:"
        find . -name "CMakeLists.txt" 2>/dev/null

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0'
        host: 'mac'
        target: 'desktop'
        modules: 'qtmultimedia qt3d'

    - name: Install Dependencies
      env:
        # ⚡️ SPEED OPTIMIZATION: Prevents brew from updating itself
        HOMEBREW_NO_AUTO_UPDATE: 1 
        # ⚡️ SPEED OPTIMIZATION: Forces usage of pre-built binaries
        HOMEBREW_NO_INSTALL_FROM_API: 1
      run: |
        echo "Installing dependencies..."
        brew install opencv tesseract cmake pkg-config jsoncpp
        brew install vulkan-headers sdl2 glew

    - name: Install OpenXR SDK (Fixed Version)
      run: |
        echo "Installing OpenXR SDK..."
        
        cd /tmp
        rm -rf OpenXR*
        
        # FIX: Upgraded from release-1.0.28 to release-1.1.43 to fix CMake error
        git clone --depth 1 --branch release-1.1.43 https://github.com/KhronosGroup/OpenXR-SDK.git
        cd OpenXR-SDK
        
        mkdir -p build && cd build
        
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/usr/local \
          -DBUILD_TESTS=OFF \
          -DBUILD_LOADER=ON \
          -DUSE_SYSTEM_JSONCPP=ON \
          -DJSONCPP_LIBRARY=/opt/homebrew/lib/libjsoncpp.dylib \
          -DJSONCPP_INCLUDE_DIR=/opt/homebrew/include/jsoncpp
        
        make -j$(sysctl -n hw.logicalcpu)
        sudo make install
        
        echo "OpenXR installation complete"

    - name: Verify OpenXR Installation
      run: |
        echo "Verifying OpenXR installation..."
        ls -la /usr/local/include/openxr/ 2>/dev/null || echo "OpenXR headers not found in /usr/local/include"

    - name: Configure CMake
      run: |
        echo "QT_ROOT_DIR: $QT_ROOT_DIR"
        
        if [ ! -f "CMakeLists.txt" ]; then
          echo "Error: CMakeLists.txt not found!"
          exit 1
        fi
        
        cmake -S . -B build \
          -G "Unix Makefiles" \
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
          -DCMAKE_BUILD_TYPE=Release \
          -DOpenXR_ROOT=/usr/local
        
        echo "CMake configuration completed"

    - name: Build
      run: |
        echo "Building project..."
        cmake --build build --config Release --parallel $(sysctl -n hw.logicalcpu)

    - name: Deploy Qt Dependencies
      run: |
        APP_BUNDLE=$(find build -name "*.app" -type d 2>/dev/null | head -1)
        
        if [ -n "$APP_BUNDLE" ] && [ -d "$APP_BUNDLE" ]; then
          echo "Found app bundle: $APP_BUNDLE"
          macdeployqt "$APP_BUNDLE" -verbose=2
        else
          echo "No .app bundle found. Looking for executable..."
          EXE_PATH=$(find build -type f -name "ArchNative" -o -name "ArchNative*" ! -name "*.*" 2>/dev/null | head -1)
          
          if [ -n "$EXE_PATH" ] && [ -f "$EXE_PATH" ]; then
            echo "Found executable: $EXE_PATH"
            mkdir -p "ArchNative.app/Contents/MacOS"
            cp "$EXE_PATH" "ArchNative.app/Contents/MacOS/ArchNative"
            macdeployqt "ArchNative.app" -verbose=2
            mv "ArchNative.app" build/
            APP_BUNDLE="build/ArchNative.app"
          else
            echo "Error: No executable found!"
            exit 1
          fi
        fi

    - name: Package DMG
      run: |
        APP_BUNDLE=$(find build -name "*.app" -type d 2>/dev/null | head -1)
        if [ -n "$APP_BUNDLE" ]; then
          macdeployqt "$APP_BUNDLE" -dmg
        else
          exit 1
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ArchNative-macOS
        path: build/*.dmg
        if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Setup Vcpkg
      shell: pwsh
      run: |
        if (-not (Test-Path "C:\vcpkg")) {
          git clone https://github.com/Microsoft/vcpkg.git C:\vcpkg
          & C:\vcpkg\bootstrap-vcpkg.bat
        }

    - name: Install Dependencies (Vcpkg)
      shell: pwsh
      run: |
        & C:\vcpkg\vcpkg install opencv:x64-windows
        & C:\vcpkg\vcpkg install tesseract:x64-windows
        & C:\vcpkg\vcpkg install openxr-loader:x64-windows
        & C:\vcpkg\vcpkg install jsoncpp:x64-windows
        & C:\vcpkg\vcpkg integrate install

    - name: Configure CMake
      shell: pwsh
      run: |
        cmake -S . -B build `
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
          -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DCMAKE_BUILD_TYPE=Release `
          -A x64

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Package
      shell: pwsh
      run: |
        if (-not (Test-Path "dist")) { New-Item -ItemType Directory -Path "dist" }
        $exePath = Get-ChildItem -Path "build" -Filter "ArchNative.exe" -Recurse | Select-Object -First 1
        
        if ($exePath) {
          Copy-Item $exePath.FullName -Destination "dist/"
          windeployqt dist/ArchNative.exe --dir dist
          
          # Copy DLLs
          $openxrDll = Get-ChildItem -Path "C:\vcpkg\installed\x64-windows\bin" -Filter "openxr_loader*.dll" | Select-Object -First 1
          if ($openxrDll) { Copy-Item $openxrDll.FullName -Destination "dist/" }
          
          $requiredDlls = @("jsoncpp.dll", "opencv_world*.dll", "tesseract*.dll")
          foreach ($dllPattern in $requiredDlls) {
            $dllFiles = Get-ChildItem -Path "C:\vcpkg\installed\x64-windows\bin" -Filter $dllPattern | Select-Object -First 1
            if ($dllFiles) { Copy-Item $dllFiles.FullName -Destination "dist/" -ErrorAction SilentlyContinue }
          }
        } else {
          exit 1
        }

    - name: Zip Windows artifacts
      shell: pwsh
      run: Compress-Archive -Path dist\* -DestinationPath ArchNative-Windows.zip -Force

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ArchNative-Windows
        path: ArchNative-Windows.zip

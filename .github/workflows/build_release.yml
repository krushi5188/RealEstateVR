name: Build ArchNative Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Enables manual button click

jobs:
  build-macos:
    runs-on: macos-13 # Force Intel (x64) for compatibility
    timeout-minutes: 60 # Prevent infinite hangs
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1 # Skip lengthy brew updates
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies (Homebrew)
      run: |
        # install specific versions or bottled packages to speed up
        brew install opencv tesseract cmake pkg-config vulkan-headers qt@6

        # Link Qt for CMake (qt@6 is keg-only)
        echo "QT_ROOT_DIR=$(brew --prefix qt@6)" >> $GITHUB_ENV
        # Add Qt bin to PATH for macdeployqt
        echo "$(brew --prefix qt@6)/bin" >> $GITHUB_PATH

    - name: Install OpenXR (Vcpkg)
      run: |
        vcpkg install openxr-loader --triplet=x64-osx

    - name: Configure CMake
      run: |
        export PKG_CONFIG_PATH=$VCPKG_INSTALLATION_ROOT/installed/x64-osx/lib/pkgconfig:$PKG_CONFIG_PATH
        # Added VCPKG Toolchain file to ensure OpenXR is found
        cmake -S ArchNative -B build -G "Unix Makefiles" -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-osx

    - name: Build
      run: cmake --build build --config Release

    - name: Package DMG
      run: |
        # Set DYLD paths to force usage of correct Qt frameworks
        export QT_LIB_DIR="$(brew --prefix qt@6)/lib"
        export DYLD_FRAMEWORK_PATH="$QT_LIB_DIR:$DYLD_FRAMEWORK_PATH"
        export DYLD_LIBRARY_PATH="$QT_LIB_DIR:$DYLD_LIBRARY_PATH"

        # Run macdeployqt with minimal verbosity to avoid confusing logs if it succeeds partially
        # and ensure it looks in the correct libpath.
        macdeployqt build/ArchNative.app -dmg -libpath=$QT_LIB_DIR -always-overwrite

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ArchNative-macOS
        path: build/ArchNative.dmg

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 180 # Increased timeout for heavy vcpkg builds
    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Cache Vcpkg
      id: cache-vcpkg
      uses: actions/cache@v4
      with:
        path: |
          C:\vcpkg\installed
          C:\vcpkg\packages
          C:\vcpkg\downloads
        key: ${{ runner.os }}-vcpkg-opencv-tesseract-openxr-v1

    - name: Install Dependencies (Vcpkg)
      if: steps.cache-vcpkg.outputs.cache-hit != 'true'
      run: |
        vcpkg install opencv:x64-windows
        vcpkg install tesseract:x64-windows
        vcpkg install openxr-loader:x64-windows
        vcpkg integrate install

    - name: Check Source Directory (Debug)
      run: |
        ls -R ArchNative

    - name: Configure CMake
      run: cmake -S ArchNative -B build -DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

    - name: Build
      run: cmake --build build --config Release

    - name: Package
      run: |
        windeployqt build/Release/ArchNative.exe --dir dist

        # Copy Vcpkg DLLs to dist folder
        # We use a wildcard copy to ensure all dependencies (opencv, tesseract, openxr, etc.) are included.
        # Note: In a real prod environment, we would be more selective, but this ensures functionality.
        Copy-Item -Path "C:/vcpkg/installed/x64-windows/bin/*.dll" -Destination "dist/" -Force

        echo "Dist folder contents:"
        ls dist

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ArchNative-Windows
        path: dist/
